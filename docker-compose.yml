services:

  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: instantshare-sqlserver

    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD}

    ports:
      - "1433:1433"

    volumes:
      - sqlserver_data:/var/opt/mssql

    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P '${MSSQL_SA_PASSWORD}' -C -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  backend:
    build:
      context: ./react.server
      dockerfile: Dockerfile

    container_name: instantshare-backend

    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__DefaultConnection: "Server=sqlserver,1433;Database=InstantShareProject;User Id=sa;Password=${MSSQL_SA_PASSWORD};TrustServerCertificate=True;"

    ports:
      - "5000:8080"

    volumes:
      - ./public:/app/react.app/public:ro

    depends_on:
      sqlserver:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend

    container_name: instantshare-frontend

    ports:
      - "3000:3000"

    depends_on:
      - backend

volumes:
  sqlserver_data: